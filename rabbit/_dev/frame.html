<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile frame test</title>
<style>
  body{margin:0;background:#2b2b2b;display:flex;gap:18px;padding:12px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:6px;align-items:center}
  .lbl{color:#ddd;font:12px/1 -apple-system,sans-serif}
  iframe{border:0;background:#fff;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div class="col"><span class="lbl">390×800 (iPhone 14)</span><iframe id="f1" src="../index.html" width="390" height="800"></iframe></div>
  <div class="col"><span class="lbl">360×640 (small)</span><iframe id="f2" src="../index.html" width="360" height="640"></iframe></div>
</body>
</html>
