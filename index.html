<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16A34A">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대파">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="대파 — 대신 파라 드립니다. 우리 동네에 없으면 인접 동네·전국 안심거래로, 팔기 귀찮으면 대파가 대신 팝니다.">
<title>대파 — 대신 파라 드립니다</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2316A34A'/%3E%3Cpath d='M20 27V13' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M20 25c-4-5-8-8-12-8.5.7 5.5 4.3 9.3 12 10.5z' fill='%23fff' opacity='.85'/%3E%3Cpath d='M20 25c4-5 8-8 12-8.5-.7 5.5-4.3 9.3-12 10.5z' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
<style>
/* ============================================================
   대파 — 대신 파라 드립니다
   Mobile-first marketplace UI. No external assets: fonts, icons,
   artwork are all local/system.
   ============================================================ */

:root{
  --green:#16A34A;
  --green-700:#15803D;
  --green-800:#14532D;
  --lime:#22C55E;
  --mint:#F0FDF4;
  --mint-2:#DCFCE7;

  --ink:#0B1220;
  --ink-2:#1F2937;
  --sub:#6B7280;
  --sub-2:#9AA3AF;
  --line:#EDF0F2;
  --line-2:#E3E7EA;
  --bg:#F6F7F8;
  --card:#FFFFFF;

  --amber:#B45309;
  --amber-bg:#FEF6E7;
  --blue:#1D4ED8;
  --blue-bg:#EEF4FF;
  --violet:#6D28D9;
  --violet-bg:#F4F0FF;
  --rose:#BE123C;

  --r-xl:26px;
  --r-lg:20px;
  --r-md:15px;
  --r-sm:11px;

  --sh-1:0 1px 2px rgba(11,18,32,.045);
  --sh-2:0 10px 28px -16px rgba(11,18,32,.30);
  --sh-3:0 22px 48px -26px rgba(11,18,32,.40);

  --frame:430px;
  --nav-h:74px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);
  letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  background:#E7EBE7;
  background-image:
    radial-gradient(120% 70% at 50% -10%, #F6FAF5 0%, rgba(246,250,245,0) 60%),
    radial-gradient(90% 60% at 100% 110%, #DDE8DE 0%, rgba(221,232,222,0) 70%),
    linear-gradient(180deg,#EDF1EC 0%,#E2E7E2 100%);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--mint-2)}

/* ---------- device frame ---------- */
.frame{
  position:relative;
  width:100%;max-width:var(--frame);
  height:100dvh;
  background:var(--bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  isolation:isolate;
}
@media (min-width:520px){
  body{padding:26px 0}
  .frame{height:min(932px,calc(100dvh - 52px));border-radius:40px;box-shadow:0 50px 90px -50px rgba(9,32,18,.55),0 0 0 1px rgba(11,18,32,.07),0 2px 0 rgba(255,255,255,.9) inset}
}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px)}
.scroll::-webkit-scrollbar{display:none}
.scroll.bare{padding-bottom:0}

/* ---------- header ---------- */
.hd{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:14px 18px 10px;
  background:#fff;
  box-shadow:0 1px 0 rgba(11,18,32,.045);
}
.hd.flat{background:var(--bg);border-bottom:0}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{
  width:34px;height:34px;border-radius:12px;
  background:linear-gradient(150deg,#EAFBEF,#D3F3DD);
  display:grid;place-items:center;
  box-shadow:0 1px 0 #fff inset,0 4px 10px -6px rgba(21,128,61,.5);
  flex:none;
}
.mark svg{width:22px;height:22px}
.bname{font-size:19px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
.bsub{font-size:10.5px;color:var(--sub);letter-spacing:-.01em;margin-top:2px;font-weight:600}
.hd-spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:var(--ink-2);
  transition:transform .16s ease,background .16s ease;flex:none;
}
.icon-btn:active{transform:scale(.94);background:#F3F5F4}
.icon-btn svg{width:20px;height:20px}
.icon-btn.ghost{background:transparent;border-color:transparent}

/* ---------- hero: neighborhood + reach ---------- */
.hero-wrap{padding:2px 16px 0}
.hero{
  position:relative;overflow:hidden;
  border-radius:var(--r-xl);
  padding:15px 15px 13px;
  background:
    radial-gradient(120% 120% at 100% 0%, #E7F9EC 0%, rgba(231,249,236,0) 62%),
    linear-gradient(155deg,#F7FCF8 0%,#EDF8F0 58%,#E4F5E9 100%);
  border:1px solid #DCF0E1;
  box-shadow:0 1px 0 #fff inset,0 12px 26px -22px rgba(21,128,61,.55);
}
.leaf-deco{position:absolute;right:-16px;top:-22px;width:118px;height:118px;opacity:.5;pointer-events:none}
.loc-row{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.loc{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 2px;border-radius:10px}
.loc .pin{width:19px;height:19px;color:var(--green-700)}
.loc-name{font-size:21px;font-weight:800;letter-spacing:-.05em}
.loc svg.caret{width:17px;height:17px;color:var(--green-700);opacity:.85}
.loc-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;color:var(--green-700);
  background:#fff;border:1px solid #CFEBD8;border-radius:999px;padding:4px 8px;
  display:flex;align-items:center;gap:4px;box-shadow:var(--sh-1)
}
.loc-badge i{width:5px;height:5px;border-radius:50%;background:var(--lime);display:block}

.track{
  position:relative;margin-top:12px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
  padding:4px;border-radius:15px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(22,163,74,.14);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
}
.seg{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 2px 6px;border-radius:11px;
  font-size:12.5px;font-weight:800;color:#5B6660;letter-spacing:-.02em;
  transition:color .18s ease,background .18s ease,box-shadow .18s ease,transform .12s ease;
}
.seg small{font-size:10px;font-weight:700;color:#94A29B;letter-spacing:0}
.seg.active{
  background:#fff;color:var(--green-700);
  box-shadow:0 6px 14px -9px rgba(21,128,61,.75),0 0 0 1px rgba(22,163,74,.16);
}
.seg.active small{color:var(--green)}
.seg:active{transform:scale(.97)}
.scope-cap{
  display:flex;align-items:center;gap:6px;margin-top:10px;
  font-size:11.8px;color:#44604F;font-weight:600;letter-spacing:-.02em;
  position:relative;z-index:1;
}
.scope-cap svg{width:14px;height:14px;flex:none;color:var(--green-700)}
.scope-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scope-cap b{color:var(--green-800);font-weight:800}
.scope-cap .go{
  margin-left:auto;display:flex;align-items:center;gap:3px;
  font-size:11px;font-weight:800;color:#fff;background:var(--green-700);
  padding:5px 9px;border-radius:999px;box-shadow:0 6px 12px -8px rgba(21,128,61,.9);
  flex:none;
}
.scope-cap .go svg{width:12px;height:12px;color:#fff}

/* ---------- trust strip ---------- */
.trust{display:flex;gap:6px;padding:11px 16px 0;overflow-x:auto;scrollbar-width:none}
.trust::-webkit-scrollbar{display:none}
.tchip{
  display:flex;align-items:center;gap:4px;flex:none;
  font-size:10.6px;font-weight:700;color:#3F4A44;letter-spacing:-.02em;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:4.5px 8px 4.5px 6px;
  box-shadow:var(--sh-1);
}
.tchip svg{width:12px;height:12px;color:var(--green-700)}
.tchip em{font-style:normal;color:var(--sub-2);font-weight:600}

/* ---------- home policy strip (선택형 판매대행 안내) ---------- */
.policy-strip{
  display:flex;align-items:center;gap:8px;margin:10px 16px 0;width:calc(100% - 32px);
  background:linear-gradient(150deg,#F5FCF8,#EAF8EF);border:1px solid #D8EEDF;border-radius:14px;
  padding:9px 10px;text-align:left;transition:transform .14s ease;
}
.policy-strip:active{transform:scale(.99)}
.policy-strip .ps-ico{width:27px;height:27px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh-1)}
.policy-strip .ps-ico svg{width:15px;height:15px;color:var(--green-700)}
.policy-strip .ps-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.policy-strip .ps-b b{font-size:11.6px;font-weight:800;color:#14532D;letter-spacing:-.035em}
.policy-strip .ps-b span{font-size:10.1px;color:#4C6B58;font-weight:600;letter-spacing:-.025em;line-height:1.35;word-break:keep-all}
.policy-strip .caret{width:13px;height:13px;color:#7FA08C;flex:none}

/* ---------- search ---------- */
.srch{padding:11px 16px 0}
.srch-box{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:0 12px;height:45px;box-shadow:var(--sh-1);
  transition:border-color .18s ease,box-shadow .18s ease;
}
.srch-box:focus-within{border-color:#A7E3BA;box-shadow:0 0 0 3px #EAF9EF}
.srch-box svg{width:18px;height:18px;color:var(--sub);flex:none}
.srch-box input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;font-weight:600;letter-spacing:-.02em}
.srch-box input::placeholder{color:#A8B0B8;font-weight:600}
.srch-box input::-webkit-search-cancel-button{display:none}
.srch-box input::-webkit-search-decoration{display:none}
.srch-clear{width:22px;height:22px;border-radius:50%;background:#F0F2F3;display:grid;place-items:center;flex:none}
.srch-clear svg{width:12px;height:12px;color:var(--sub)}

/* ---------- categories ---------- */
.cats{display:flex;gap:7px;padding:11px 16px 0;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:none;font-size:12.5px;font-weight:700;color:#4B5563;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;letter-spacing:-.02em;transition:all .16s ease;
  display:flex;align-items:center;gap:4px;
}
.cat:active{transform:scale(.96)}
.cat.active{
  background:var(--ink);border-color:var(--ink);color:#fff;
  box-shadow:0 8px 16px -12px rgba(11,18,32,.9);
}

/* ---------- feed ---------- */
.feed-head{display:flex;align-items:center;gap:8px;padding:16px 18px 9px}
.feed-head .total{font-size:12.5px;color:var(--sub);font-weight:600;letter-spacing:-.02em}
.feed-head .total b{color:var(--ink);font-weight:800;font-size:13.5px;margin-right:1px}
.sort{
  margin-left:auto;display:flex;align-items:center;gap:3px;
  font-size:12px;font-weight:700;color:#374151;padding:4px 2px;
}
.sort svg{width:14px;height:14px;color:var(--sub)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 11px;padding:0 16px}
.card{display:flex;flex-direction:column;gap:0;text-align:left;transition:transform .15s ease}
.card:active{transform:scale(.982)}
.thumb{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  aspect-ratio:1/1;
  background:linear-gradient(160deg,#FFFFFF 8%,var(--l) 118%);
  display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(11,18,32,.035);
}
.thumb .art{width:68%;height:68%}
.thumb::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
}
.badges{position:absolute;left:7px;top:7px;right:34px;display:flex;flex-wrap:wrap;gap:4px;z-index:2}
.bdg{
  font-size:9.5px;font-weight:800;letter-spacing:-.02em;line-height:1;
  padding:4.5px 6px;border-radius:7px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(4px);
  box-shadow:0 2px 6px -3px rgba(11,18,32,.35);
  display:flex;align-items:center;gap:3px;white-space:nowrap;
}
.bdg i{width:4px;height:4px;border-radius:50%;display:block;background:currentColor;opacity:.9}
.bdg.home{color:var(--green-700)}
.bdg.ship{color:var(--blue)}
.bdg.proxy{color:#fff;background:linear-gradient(135deg,#166534,#15803D)}
.bdg.fixed{color:var(--amber)}
.bdg.deposit{color:var(--violet)}
.like{
  position:absolute;right:6px;top:6px;z-index:3;
  width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  transition:transform .16s ease,background .16s ease;
}
.like svg{width:15px;height:15px;color:#3F4A44}
.like:active{transform:scale(.88)}
.like.on{background:rgba(255,255,255,.92)}
.like.on svg{color:var(--rose);fill:var(--rose)}
.cbody{padding:8px 3px 0}
.ctitle{
  font-size:13.2px;font-weight:600;line-height:1.34;color:#222B36;letter-spacing:-.03em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.68em;
}
.cprice{display:flex;align-items:baseline;gap:1px;margin-top:3px}
.cprice b{font-size:15.5px;font-weight:800;letter-spacing:-.045em}
.cprice span{font-size:11.5px;font-weight:700;color:#5B6672}
.cmeta{margin-top:3px;font-size:10.8px;color:var(--sub-2);font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:3px}
.cmeta .dot{width:2px;height:2px;border-radius:50%;background:currentColor;display:block;opacity:.7}
.cmeta .proxy-tag{color:var(--green-700);font-weight:800}

/* empty */
.empty{
  margin:6px 16px 0;padding:26px 18px;border-radius:var(--r-xl);
  background:linear-gradient(160deg,#FFFFFF,#F3F8F4);
  border:1px solid var(--line);text-align:center;
  box-shadow:var(--sh-1);
}
.empty .eico{
  width:52px;height:52px;border-radius:17px;margin:0 auto 12px;display:grid;place-items:center;
  background:linear-gradient(150deg,#EAFBEF,#D5F3DE);
}
.empty .eico svg{width:26px;height:26px;color:var(--green-700)}
.empty h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.04em}
.empty p{margin:6px 0 0;font-size:12.2px;color:var(--sub);line-height:1.55;font-weight:600;letter-spacing:-.02em}
.empty .eacts{display:flex;gap:7px;justify-content:center;margin-top:14px}
.pill-btn{
  font-size:12.5px;font-weight:800;padding:9px 14px;border-radius:999px;
  background:var(--green);color:#fff;box-shadow:0 10px 20px -14px rgba(21,128,61,1);
  display:inline-flex;align-items:center;gap:4px;letter-spacing:-.02em;
}
.pill-btn.ghost{background:#fff;color:#374151;border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.pill-btn svg{width:14px;height:14px}

/* teaser beyond scope */
.teaser{padding:22px 0 6px}
.teaser-head{display:flex;align-items:baseline;gap:7px;padding:0 18px 9px}
.teaser-head b{font-size:14px;font-weight:800;letter-spacing:-.04em}
.teaser-head span{font-size:11.5px;color:var(--green-700);font-weight:800;background:#EAF9EF;border-radius:999px;padding:3px 7px}
.teaser-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.teaser-scroll::-webkit-scrollbar{display:none}
.mini{
  flex:none;width:142px;border-radius:var(--r-md);overflow:hidden;background:#fff;
  border:1px solid var(--line);box-shadow:var(--sh-1);text-align:left;
}
.mini .thumb{border-radius:0;aspect-ratio:1.35/1;box-shadow:none}
.mini .thumb .art{width:62%;height:62%}
.mini .mb{padding:7px 9px 9px}
.mini .mt{font-size:11.5px;font-weight:700;color:#26303A;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.03em}
.mini .mp{font-size:12.5px;font-weight:800;margin-top:2px;letter-spacing:-.04em}
.mini .mh{font-size:10px;color:var(--sub-2);font-weight:600;margin-top:2px}
.more-tile{
  flex:none;width:96px;border-radius:var(--r-md);border:1px dashed #C9DACD;background:#F1F9F3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--green-700);font-size:11.5px;font-weight:800;letter-spacing:-.03em;
}
.more-tile svg{width:20px;height:20px}

/* ---------- bottom nav ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 14px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:#fff;
  border-top:1px solid var(--line);
  box-shadow:0 -12px 26px -24px rgba(11,18,32,.5);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#93A0A6;letter-spacing:-.02em;padding:6px 0}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--ink)}
.tab.active svg{color:var(--green-700)}
.tab-center{
  display:flex;align-items:center;gap:5px;
  padding:11px 16px;border-radius:999px;margin:0 6px;
  background:linear-gradient(150deg,#1BA94F,#14803C);
  color:#fff;font-size:12.8px;font-weight:800;letter-spacing:-.03em;
  box-shadow:0 12px 22px -12px rgba(20,128,60,.95),0 1px 0 rgba(255,255,255,.28) inset;
  transition:transform .16s ease;
}
.tab-center:active{transform:scale(.96)}
.tab-center svg{width:16px;height:16px}

/* ---------- detail ---------- */
.dtop{
  position:absolute;left:0;right:0;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;padding:12px 14px;
}
.dtop .icon-btn{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7);box-shadow:0 6px 16px -10px rgba(11,18,32,.5)}
.dtop .sp{flex:1}
.hero-img{
  position:relative;aspect-ratio:1/.78;overflow:hidden;
  background:linear-gradient(160deg,#FFFFFF 6%,var(--l) 120%);
  display:grid;place-items:center;
}
.hero-img .art{width:60%;height:60%;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.hero-img::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 55% at 50% 0,rgba(255,255,255,.6),rgba(255,255,255,0) 65%);pointer-events:none}
.hero-badges{position:absolute;left:14px;bottom:14px;display:flex;gap:5px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 140px)}
.hero-badges .bdg{font-size:10.5px;padding:6px 8px;border-radius:9px;box-shadow:0 6px 14px -8px rgba(11,18,32,.45)}
.thumbs{position:absolute;right:12px;bottom:12px;display:flex;gap:5px;z-index:3}
.thumbs .t{
  width:34px;height:34px;border-radius:10px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,#fff,var(--l));
  box-shadow:0 0 0 1px rgba(255,255,255,.8),0 4px 10px -6px rgba(11,18,32,.5);
  opacity:.72;transition:opacity .16s,transform .16s;
}
.thumbs .t.on{opacity:1;box-shadow:0 0 0 2px var(--green),0 6px 12px -8px rgba(21,128,61,.9)}
.thumbs .t svg{width:74%;height:74%}

.dbody{padding:16px 18px 0}
.d-eyebrow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:-.02em}
.d-eyebrow .dot{width:2px;height:2px;border-radius:50%;background:currentColor}
.d-title{font-size:20px;font-weight:800;line-height:1.32;letter-spacing:-.05em;margin:7px 0 0}
.d-price{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.d-price b{font-size:27px;font-weight:800;letter-spacing:-.055em}
.d-price .w{font-size:15px;font-weight:700;color:#3B4753;margin-left:-3px}
.tag{
  font-size:10.5px;font-weight:800;padding:5px 8px;border-radius:8px;letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none;
}
.tag.fixed{background:var(--amber-bg);color:var(--amber)}
.tag.escrow{background:var(--mint);color:var(--green-700)}
.tag.dep{background:var(--violet-bg);color:var(--violet)}
.tag.priv{background:var(--blue-bg);color:var(--blue)}
.fixed-note{
  margin-top:10px;display:flex;align-items:center;gap:7px;
  background:#FBFDFB;border:1px solid #E6EFE8;border-radius:12px;padding:9px 11px;
  font-size:11.8px;font-weight:700;color:#3D5548;letter-spacing:-.025em;
}
.fixed-note svg{width:15px;height:15px;color:var(--green-700);flex:none}
.fixed-note.amber{background:var(--amber-bg);border-color:#F2E3C6;color:#7C4A0B}
.fixed-note.amber svg{color:var(--amber)}

.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#2B3540;letter-spacing:-.03em;margin-bottom:8px}
.sec-h svg{width:15px;height:15px;color:var(--sub)}
.sec-h .r{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:700}

.seller{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-lg);
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1);
}
.ava{
  width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;
  font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(150deg,#5BC97E,#15803D);
  box-shadow:0 6px 14px -10px rgba(21,128,61,.9);
}
.ava.proxy{background:linear-gradient(150deg,#1F2937,#0B1220);color:#C6F6D5}
.ava.sm{width:20px;height:20px;border-radius:7px;font-size:9px}
.seller .sname{font-size:13.5px;font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:5px}
.seller .sname .mini-tag{font-size:9.5px;font-weight:800;color:var(--green-700);background:var(--mint);padding:2px 5px;border-radius:5px}
.seller .smeta{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
.seller .smeta .dot{width:2px;height:2px;border-radius:50%;background:currentColor}
.seller .chat-btn{
  margin-left:auto;flex:none;font-size:11.8px;font-weight:800;color:var(--green-700);
  background:var(--mint);border:1px solid #CFEBD8;border-radius:10px;padding:8px 10px;
}

/* 판매자 정보 비공개 / 무보관 대행 안내 */
.proxy-trust{
  margin-top:8px;border-radius:var(--r-lg);padding:11px 12px;
  background:linear-gradient(155deg,#F7FCF9,#EFF9F3);border:1px solid #D8EEDF;
}
.proxy-trust .pt-h{display:flex;align-items:center;gap:6px;font-size:11.6px;font-weight:800;color:#14532D;letter-spacing:-.03em}
.proxy-trust .pt-h svg{width:14px;height:14px;color:var(--green-700);flex:none}
.proxy-trust .pt-l{display:flex;align-items:flex-start;gap:5px;font-size:10.9px;font-weight:600;color:#3E5C48;line-height:1.45;margin-top:5px;letter-spacing:-.02em}
.proxy-trust .pt-l svg{width:12px;height:12px;color:var(--green);flex:none;margin-top:2px}
.proxy-trust .pt-l div{word-break:keep-all}

.kv{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1)}
.kv-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid #F3F5F6}
.kv-row:last-child{border-bottom:0}
.kv-row .k{font-size:11.5px;color:var(--sub);font-weight:700;width:74px;flex:none;letter-spacing:-.02em}
.kv-row .v{font-size:12.3px;font-weight:700;color:#26303A;line-height:1.45;letter-spacing:-.025em}
.kv-row .v small{display:block;font-size:10.8px;color:var(--sub-2);font-weight:600;margin-top:2px}

.escrow-card{
  border-radius:var(--r-lg);padding:13px 13px 12px;
  background:linear-gradient(155deg,#F6FCF8,#EAF8EF);
  border:1px solid #D8EEDF;
}
.esteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.estep{background:rgba(255,255,255,.8);border-radius:11px;padding:8px 7px;text-align:center}
.estep .n{width:19px;height:19px;border-radius:50%;background:var(--green-700);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin:0 auto 5px}
.estep .l{font-size:10.5px;font-weight:800;color:#22402E;letter-spacing:-.03em}
.estep .s{font-size:9.3px;color:#5C7A66;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.escrow-title{display:flex;align-items:center;gap:6px;font-size:12.3px;font-weight:800;color:#14532D;letter-spacing:-.03em}
.escrow-title svg{width:15px;height:15px}
.escrow-desc{font-size:11.2px;color:#3E5C48;font-weight:600;line-height:1.5;margin-top:5px;letter-spacing:-.02em}

.desc{font-size:12.8px;line-height:1.72;color:#333E4A;font-weight:500;white-space:pre-line;letter-spacing:-.02em}
.desc-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--sh-1)}

/* sticky cta */
.cta-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  padding:11px 14px calc(12px + env(safe-area-inset-bottom));
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center;
  box-shadow:0 -14px 30px -26px rgba(11,18,32,.55);
}
.cta-bar .ghost-sq{
  width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line-2);
}
.cta-bar .ghost-sq svg{width:20px;height:20px;color:#3B4753}
.btn-primary{
  flex:1;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(150deg,#1BA94F,#147A38);
  color:#fff;font-size:14px;font-weight:800;letter-spacing:-.03em;
  box-shadow:0 14px 26px -16px rgba(20,128,60,1),0 1px 0 rgba(255,255,255,.25) inset;
  transition:transform .16s ease;
}
.btn-primary:active{transform:scale(.985)}
.btn-primary svg{width:17px;height:17px}
.btn-secondary{
  flex:none;height:50px;padding:0 14px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:#fff;color:#1F4331;font-size:12.8px;font-weight:800;letter-spacing:-.03em;
  border:1px solid #CFE7D7;box-shadow:var(--sh-1);
}
.btn-secondary svg{width:15px;height:15px;color:var(--green-700)}

/* ---------- sheets ---------- */
.layers{position:absolute;inset:0;z-index:60;pointer-events:none}
.layers > *{pointer-events:auto}
.backdrop{
  position:absolute;inset:0;background:rgba(9,15,20,.38);backdrop-filter:blur(2px);
  animation:fade .22s ease both;
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  max-height:92%;
  background:var(--bg);
  border-radius:26px 26px 0 0;
  box-shadow:0 -20px 60px -20px rgba(9,15,20,.5);
  display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.2,.8,.25,1) both;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:#D6DBDF;margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 18px 8px;flex:none}
.sheet-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.045em}
.sheet-head .sub{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px;letter-spacing:-.02em}
.sheet-head .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#EBEEF0;display:grid;place-items:center;flex:none}
.sheet-head .x svg{width:14px;height:14px;color:#5B6672}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;flex:1;min-height:0}
.sheet-foot{padding:10px 16px 14px;background:linear-gradient(180deg,rgba(246,247,248,0),#F6F7F8 30%);flex:none}

.opt{
  display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;
  background:#fff;border:1px solid var(--line);margin-bottom:8px;box-shadow:var(--sh-1);
  width:100%;text-align:left;transition:border-color .16s,box-shadow .16s;
}
.opt.on{border-color:var(--green);box-shadow:0 0 0 3px #E9F9EE}
.opt .oname{font-size:13.5px;font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:6px}
.opt .ometa{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px}
.opt .chk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid #D2D8DC;display:grid;place-items:center;flex:none}
.opt.on .chk{background:var(--green);border-color:var(--green)}
.opt .chk svg{width:12px;height:12px;color:#fff;opacity:0}
.opt.on .chk svg{opacity:1}

.rows{background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);padding:4px 13px;box-shadow:var(--sh-1)}
.row{display:flex;align-items:center;padding:10px 0;border-bottom:1px dashed #EFF2F3;font-size:12.6px}
.row:last-child{border-bottom:0}
.row .k{color:#586473;font-weight:600;letter-spacing:-.02em}
.row .v{margin-left:auto;font-weight:800;letter-spacing:-.03em;color:#1F2937}
.row.total{padding:12px 0;font-size:13.5px}
.row.total .k{color:var(--ink);font-weight:800}
.row.total .v{font-size:18px;font-weight:800;letter-spacing:-.05em;color:var(--green-700)}

.note{
  display:flex;gap:8px;padding:11px 12px;border-radius:13px;margin-top:10px;
  background:#EFF8F2;border:1px solid #DBEFE2;
  font-size:11.4px;line-height:1.55;color:#33513D;font-weight:600;letter-spacing:-.02em;
}
.note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--green-700)}
.note.warn{background:var(--amber-bg);border-color:#F3E3C5;color:#6B430F}
.note.warn svg{color:var(--amber)}

.summary{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:var(--sh-1);margin-bottom:10px}
.summary .thumb{width:52px;height:52px;border-radius:11px;flex:none;aspect-ratio:auto}
.summary .thumb .art{width:78%;height:78%}
.summary .st{font-size:12.3px;font-weight:700;letter-spacing:-.03em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.summary .sp{font-size:13px;font-weight:800;margin-top:3px;letter-spacing:-.04em}

/* deposit picker */
.timechips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.tchip-btn{
  font-size:12px;font-weight:800;padding:9px 11px;border-radius:11px;background:#fff;
  border:1px solid var(--line-2);color:#3B4753;letter-spacing:-.02em;
}
.tchip-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{display:flex;align-items:center;gap:9px;padding:10px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:#F4F6F5}
.msg{max-width:78%;padding:9px 11px;border-radius:14px;font-size:12.5px;line-height:1.5;font-weight:600;letter-spacing:-.02em;box-shadow:var(--sh-1)}
.msg.them{background:#fff;border-top-left-radius:5px;align-self:flex-start;color:#26303A}
.msg.me{background:linear-gradient(150deg,#1BA94F,#147A38);color:#fff;border-top-right-radius:5px;align-self:flex-end}
.msg.sys{align-self:center;background:transparent;box-shadow:none;font-size:10.8px;color:var(--sub-2);font-weight:700}
.chat-input{display:flex;gap:7px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;flex:none}
.chat-input input{flex:1;height:42px;border-radius:12px;border:1px solid var(--line-2);background:#F8F9FA;padding:0 12px;outline:0;font-size:13px;font-weight:600}
.chat-input input:focus{border-color:#A7E3BA;background:#fff}
.chat-input button{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex:none}
.chat-input button svg{width:18px;height:18px;color:#fff}

/* ---------- sell form ---------- */
.page-hd{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:12px 14px;background:#fff;
  border-bottom:1px solid var(--line);
}
.page-hd h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.045em}
.page-hd .sp{flex:1}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px 16px 0}
.mode{
  padding:12px 10px;border-radius:15px;background:#fff;border:1px solid var(--line);
  text-align:left;box-shadow:var(--sh-1);transition:all .16s ease;
}
.mode .mt{font-size:12.8px;font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:5px;color:#3B4753}
.mode .mt .m-tag{font-size:8.6px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--mint-2);color:var(--green-800);letter-spacing:-.01em;flex:none}
.mode .mt .m-tag.sub{background:#EEF1F4;color:#5B6672}
.mode .ms{font-size:10.3px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.35;letter-spacing:-.02em}
.mode svg{width:15px;height:15px}
.mode.on{background:linear-gradient(155deg,#F3FCF6,#E7F8EC);border-color:#B7E6C6;box-shadow:0 0 0 3px #EDFBF1,0 10px 20px -18px rgba(21,128,61,.9)}
.mode.on .mt{color:var(--green-800)}
.mode.on svg{color:var(--green-700)}

.proxy-intro{
  margin:12px 16px 0;padding:13px;border-radius:var(--r-lg);
  background:linear-gradient(150deg,#0F172A,#152A20);
  color:#EAF6EE;position:relative;overflow:hidden;
}
.proxy-intro .pi-t{font-size:13px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.proxy-intro .pi-t svg{width:16px;height:16px;color:#6EE7A0;flex:none}
.proxy-intro .pi-t .pi-opt{margin-left:auto;font-size:8.8px;font-weight:800;color:#9EF0B9;background:rgba(110,231,160,.16);border:1px solid rgba(110,231,160,.28);border-radius:6px;padding:2px 6px;letter-spacing:-.01em}
.proxy-intro .pi-d{font-size:11.3px;line-height:1.6;color:#A7C4B2;font-weight:600;margin-top:5px;letter-spacing:-.02em;word-break:keep-all}
.proxy-intro .pi-steps{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.pi-step{background:rgba(255,255,255,.075);border-radius:10px;padding:7px 8px 8px;text-align:left}
.pi-step .n{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:rgba(110,231,160,.22);color:#B9F5CE;font-size:8.8px;font-weight:800;margin-right:4px;vertical-align:1px}
.pi-step .ps-t{font-size:10.4px;font-weight:800;color:#DFF7E7;letter-spacing:-.035em}
.pi-step .ps-s{display:block;font-size:9.1px;color:#87A895;font-weight:600;margin-top:3px;line-height:1.35;letter-spacing:-.02em;word-break:keep-all}
.pi-keys{display:flex;flex-direction:column;gap:4px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.1)}
.pi-key{display:flex;align-items:flex-start;gap:5px;font-size:10.2px;font-weight:700;color:#C9EBD5;letter-spacing:-.025em;line-height:1.4}
.pi-key svg{width:12px;height:12px;color:#6EE7A0;flex:none;margin-top:1px}
.pi-key b{color:#8FF0B0;font-weight:800}

/* 판매 등록 상단 안내 줄 */
.policy-line{
  display:flex;align-items:flex-start;gap:7px;margin:12px 16px 0;padding:10px 11px;border-radius:13px;
  background:#FBFDFB;border:1px solid #E6EFE8;font-size:10.9px;font-weight:600;color:#3D5548;
  letter-spacing:-.025em;line-height:1.5;word-break:keep-all;
}
.policy-line svg{width:14px;height:14px;color:var(--green-700);flex:none;margin-top:1px}
.policy-line b{font-weight:800;color:#14532D}
.policy-notice{
  display:flex;align-items:flex-start;gap:7px;margin:9px 16px 0;padding:10px 11px;border-radius:13px;
  background:var(--amber-bg);border:1px solid #F2E3C6;font-size:10.8px;font-weight:700;color:#7C4A0B;
  letter-spacing:-.025em;line-height:1.5;word-break:keep-all;
}
.policy-notice svg{width:14px;height:14px;color:var(--amber);flex:none;margin-top:1px}
.policy-notice b{font-weight:800}

.form{padding:4px 16px 0}
.field{margin-top:14px}
.label{font-size:11.8px;font-weight:800;color:#3B4753;letter-spacing:-.02em;display:flex;align-items:center;gap:5px;margin-bottom:7px}
.label .req{color:var(--green);font-size:11px}
.label .hint{margin-left:auto;font-size:10.8px;color:var(--sub-2);font-weight:600}
.input,textarea.input{
  width:100%;border:1px solid var(--line-2);background:#fff;border-radius:13px;
  padding:12px 13px;font-size:13.5px;font-weight:600;letter-spacing:-.02em;outline:0;
  transition:border-color .16s,box-shadow .16s;
}
.input::placeholder{color:#AEB6BD;font-weight:600}
.input:focus{border-color:#A7E3BA;box-shadow:0 0 0 3px #EDFBF1}
textarea.input{min-height:92px;resize:none;line-height:1.6}
.price-input{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:13px;padding:0 13px;height:50px}
.price-input:focus-within{border-color:#A7E3BA;box-shadow:0 0 0 3px #EDFBF1}
.price-input input{flex:1;border:0;outline:0;font-size:17px;font-weight:800;letter-spacing:-.04em;background:none;min-width:0}
.price-input .w{font-size:13px;font-weight:700;color:#5B6672}
.quick-price{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.qp{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;background:#F1F3F4;color:#586473;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-size:12px;font-weight:700;padding:9px 12px;border-radius:11px;background:#fff;
  border:1px solid var(--line-2);color:#4B5563;letter-spacing:-.02em;transition:all .15s;
}
.chip.on{background:var(--mint);border-color:#A9E2BC;color:var(--green-800);font-weight:800}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo{
  aspect-ratio:1/1;border-radius:13px;border:1px dashed #C9D3D8;background:#fff;
  display:grid;place-items:center;position:relative;overflow:hidden;gap:2px;
}
.photo.filled{border-style:solid;border-color:var(--line);background:linear-gradient(160deg,#fff,var(--l,#EAF3EC))}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph-l{font-size:10px;color:var(--sub-2);font-weight:700;letter-spacing:-.02em}
.photo .ph-x{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:rgba(11,18,32,.55);display:grid;place-items:center}
.photo .ph-x svg{width:11px;height:11px;color:#fff}
.photo .num{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:800;color:#fff;background:rgba(11,18,32,.55);border-radius:5px;padding:2px 4px}
.photo .art{width:64%;height:64%}
.photo > svg:not(.art){width:24px;height:24px;color:#BCC6CD}

.toggle-row{
  display:flex;align-items:center;gap:10px;padding:12px 13px;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);
}
.toggle-row .tt{font-size:12.8px;font-weight:800;letter-spacing:-.03em}
.toggle-row .td{font-size:10.8px;color:var(--sub);font-weight:600;margin-top:2px;letter-spacing:-.02em}
.switch{
  margin-left:auto;width:44px;height:26px;border-radius:99px;background:#DCE1E5;position:relative;flex:none;transition:background .18s;
}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(11,18,32,.25);transition:transform .18s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}

.fee-box{
  margin-top:16px;border-radius:var(--r-lg);padding:14px;
  background:linear-gradient(155deg,#F6FCF8,#EAF8EF);border:1px solid #D8EEDF;
}
.fee-row{display:flex;align-items:center;font-size:12.2px;font-weight:600;color:#3E5C48;padding:3px 0;letter-spacing:-.02em}
.fee-row .v{margin-left:auto;font-weight:800;color:#1F4230}
.fee-total{display:flex;align-items:flex-end;padding-top:9px;margin-top:6px;border-top:1px dashed #C9E6D3}
.fee-total .k{font-size:12px;font-weight:800;color:#14532D}
.fee-total .v{margin-left:auto;font-size:21px;font-weight:800;color:var(--green-700);letter-spacing:-.05em}
.fee-note{font-size:10.6px;color:#5C7A66;font-weight:600;margin-top:5px;line-height:1.5}

.submit-wrap{padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.err{font-size:11px;color:#D92D20;font-weight:700;margin-top:6px;display:none}
.field.invalid .input,.field.invalid .price-input{border-color:#F3B4AE;box-shadow:0 0 0 3px #FEF3F2}
.field.invalid .err{display:block}

/* ---------- my page ---------- */
.me-top{padding:16px 18px 0}
.profile{display:flex;align-items:center;gap:12px}
.ava-lg{
  width:54px;height:54px;border-radius:19px;flex:none;display:grid;place-items:center;
  font-size:20px;font-weight:800;color:#fff;
  background:linear-gradient(150deg,#34C26B,#147A38);
  box-shadow:0 12px 22px -14px rgba(21,128,61,1);
}
.profile .pname{font-size:16.5px;font-weight:800;letter-spacing:-.045em}
.profile .pmeta{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
.profile .pmeta .dot{width:2px;height:2px;border-radius:50%;background:currentColor}
.pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pstat .ps{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 11px;box-shadow:var(--sh-1)}
.pstat .k{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:-.02em}
.pstat .v{font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.045em}
.pstat .v.green{color:var(--green-700)}

.mtabs{display:flex;gap:4px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{
  flex:none;font-size:12.2px;font-weight:800;color:#6B7681;padding:8px 11px;border-radius:10px;letter-spacing:-.03em;
  background:#fff;border:1px solid var(--line);
}
.mtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mtab .cnt{font-size:10px;opacity:.7;margin-left:2px}

.deals{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.deal{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;box-shadow:var(--sh-1)}
.deal-top{display:flex;gap:10px;align-items:flex-start}
.deal .thumb{width:58px;height:58px;border-radius:13px;flex:none;aspect-ratio:auto}
.deal .thumb .art{width:78%;height:78%}
.deal .dt{font-size:12.5px;font-weight:700;line-height:1.35;letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal .dp{font-size:13.5px;font-weight:800;margin-top:4px;letter-spacing:-.04em}
.deal .dm{font-size:10.8px;color:var(--sub);font-weight:600;margin-top:3px}
.deal .status{
  font-size:10px;font-weight:800;padding:4px 7px;border-radius:7px;letter-spacing:-.02em;flex:none;
  background:var(--mint);color:var(--green-700);
}
.deal .status.done{background:#F1F3F4;color:#6B7681}
.deal .status.pay{background:var(--blue-bg);color:var(--blue)}
.deal .status.dep{background:var(--violet-bg);color:var(--violet)}
.deal .status.pick{background:var(--amber-bg);color:var(--amber)}
.steps{display:flex;align-items:center;margin-top:12px;gap:0}
.step{flex:1;position:relative;text-align:center}
.step .bar{height:3px;border-radius:99px;background:#E9EDEF;margin:0 0 7px;position:relative;overflow:hidden}
.step.done .bar,.step.cur .bar{background:var(--green)}
.step.cur .bar{background:var(--green)}
.step .sl{font-size:9.4px;font-weight:700;color:#A8B0B8;letter-spacing:-.03em}
.step.done .sl{color:#5B7A66}
.step.cur .sl{color:var(--green-800);font-weight:800}
.deal-actions{display:flex;gap:6px;margin-top:11px}
.da{
  flex:1;font-size:11.8px;font-weight:800;padding:9px;border-radius:11px;text-align:center;letter-spacing:-.03em;
  background:#F3F5F6;color:#4B5563;display:flex;align-items:center;justify-content:center;gap:4px;
}
.da svg{width:13px;height:13px;flex:none}
.hint-line{font-size:10.3px;font-weight:600;color:var(--sub);margin-top:8px;letter-spacing:-.025em;line-height:1.45;word-break:keep-all}
.pick-banner{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:8px 9px;border-radius:11px;background:var(--amber-bg);border:1px solid #F2E3C6}
.pick-banner > svg{width:14px;height:14px;color:var(--amber);flex:none;margin-top:1px}
.pick-banner b{display:block;font-size:10.8px;font-weight:800;color:#7C4A0B;letter-spacing:-.025em}
.pick-banner span{display:block;font-size:10px;font-weight:600;color:#8A5A16;margin-top:1px;letter-spacing:-.02em}
.da.primary{background:var(--green);color:#fff;box-shadow:0 8px 16px -12px rgba(21,128,61,1)}
.da.outline{background:#fff;border:1px solid var(--line-2)}
.me-foot{padding:22px 16px 8px;text-align:center}
.me-foot button{font-size:11px;font-weight:700;color:var(--sub-2);text-decoration:underline;text-underline-offset:3px}

/* liked grid reuses .grid */

/* toast */
.toast{
  position:absolute;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);transform:translate(-50%,14px);
  z-index:90;display:flex;align-items:center;gap:7px;
  background:rgba(11,18,32,.93);color:#fff;font-size:12.3px;font-weight:700;letter-spacing:-.02em;
  padding:11px 15px;border-radius:13px;box-shadow:0 20px 40px -22px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  max-width:calc(100% - 40px);word-break:keep-all;text-align:left;
}
.toast svg{width:15px;height:15px;color:#6EE7A0;flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* success block */
.done-block{text-align:center;padding:9px 4px 3px}
.done-ico{
  width:60px;height:60px;border-radius:22px;margin:4px auto 12px;display:grid;place-items:center;
  background:linear-gradient(150deg,#EAFBEF,#CFF0DA);box-shadow:0 12px 24px -16px rgba(21,128,61,.9);
}
.done-ico svg{width:30px;height:30px;color:var(--green-700)}
.done-block h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.045em}
.done-block p{margin:7px 0 0;font-size:12.3px;color:var(--sub);font-weight:600;line-height:1.55;letter-spacing:-.02em}
.done-rows{margin-top:14px;text-align:left}

/* ---------- structural fixes / additions ---------- */
#app > .view-enter{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.thumb img.upimg,.hero-img img.upimg{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.hero-img img.upimg{position:absolute;inset:0}
.home-foot{padding:22px 22px 10px;text-align:center;font-size:10.6px;color:#A8B0B8;font-weight:600;letter-spacing:-.03em;line-height:1.6}
.dtop > .icon-btn:first-child svg{transform:rotate(180deg)}
.page-hd > .icon-btn:first-child svg{transform:rotate(180deg)}
#fileIn{display:none}
.card .ctitle{word-break:keep-all}
.d-title,.desc,.ctitle,.dt,.st{word-break:keep-all}

@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.view-enter{animation:pop .26s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    const lv = levelOf(it);
    const ok = scope === 'home' ? lv === 'home' : scope === 'near' ? lv !== 'nation' : true;
    if (!ok) return false;
    if (S.cat !== '전체' && it.cat !== S.cat) return false;
    if (S.q) {
      const q = S.q.toLowerCase();
      const hay = (it.title + ' ' + (it.desc || '') + ' ' + it.cat + ' ' + it.hood).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  function visible() {
    const list = allItems().filter((it) => passFilter(it, S.scope));
    if (S.sort === '낮은 가격') list.sort((a, b) => a.price - b.price);
    else if (S.sort === '최신순') list.sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0));
    else list.sort((a, b) => b.likes - a.likes);
    return list;
  }

  function counts() {
    const home = allItems().filter((it) => passFilter(it, 'home')).length;
    const near = allItems().filter((it) => passFilter(it, 'near')).length;
    const nation = allItems().filter((it) => passFilter(it, 'nation')).length;

  /* ---------- actions ---------- */
  function toast(msg) {
    let t = $('#toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      $('#frame').appendChild(t);
    }
    t.innerHTML = ico('check') + '<span>' + esc(msg) + '</span>';
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function go(name) {
    const sc = $('#scroll');
    if (sc && view.name === 'home') scrollMemo.home = sc.scrollTop;
    if (name === 'sell') form = blankForm();
    view = { name: name };
    photoIdx = 0;
    render();

  function render() {
    const app = $('#app');
    let html = '';
    if (view.name === 'home') html = homeHTML();
    else if (view.name === 'detail') {
      const it = itemById(view.id);
      if (!it) { view = { name: 'home' }; html = homeHTML(); }
      else html = detailHTML(it);
    } else if (view.name === 'sell') html = sellHTML();
    else if (view.name === 'me') html = meHTML();
    app.innerHTML = html;
    const sc = $('#scroll');
    if (sc) sc.scrollTop = view.name === 'home' ? (scrollMemo.home || 0) : 0;
  }

    const f = $('#feed');

  function setLike(id) {
    const i = S.likes.indexOf(id);
    if (i > -1) S.likes.splice(i, 1); else S.likes.push(id);
    save();
  }

  /* ---------- event wiring ---------- */
  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');

    switch (act) {
      case 'go': go(el.getAttribute('data-view')); break;
      case 'go-proxy': {
        form = blankForm();
        form.mode = 'proxy';
        view = { name: 'sell' };
        photoIdx = 0;
        closeSheet();
        render();
        break;
      }
      case 'back': {
        if (view.name === 'detail' || view.name === 'sell') go('home');
        break;
      }
      case 'item': go2(itemById(id)); break;
      case 'like': {
        e.stopPropagation();
        setLike(id);
        if (view.name === 'home') renderFeed();
        else render();
        toast(isLiked(id) ? '찜한 상품에 담았어요' : '찜을 해제했어요');
        break;
      }
      case 'scope': {
        S.scope = el.getAttribute('data-scope');
        save();
        render();
        break;
      }
      case 'cat': {
        S.cat = el.getAttribute('data-cat');
        save();
        render();
        break;
      }
      case 'sort': {
        const opts = ['추천순', '최신순', '낮은 가격'];
        S.sort = opts[(opts.indexOf(S.sort) + 1) % opts.length];
        save();
        render();
        break;
      }
      case 'clearq': S.q = ''; save(); render(); break;
      case 'clearfilter': S.q = ''; S.cat = '전체'; save(); render(); break;
      case 'hood': openHood(); break;
      case 'sethood': S.hood = el.getAttribute('data-hood'); save(); closeSheet(); render(); toast(S.hood + '(으)로 동네를 바꿨어요'); break;
      case 'noti': openNoti(); break;
      case 'close': closeSheet(); break;
      case 'photo': photoIdx = Number(el.getAttribute('data-i')); render(); break;
      case 'buy': openBuy(itemById(id)); break;
      case 'deposit': openDeposit(itemById(id)); break;
      case 'chat': openChat(id); break;
      case 'share': toast('링크를 복사했어요'); break;
      case 'savenote': toast('등록한 매물은 이 기기에 저장돼요'); break;

      case 'pay': {
        const it = itemById(id);
        const ship = shipOf(it);
        const fee = Math.round(it.price * 0.02);
        const total = it.price + ship + fee;
        const o = { id: 'o' + Date.now(), itemId: it.id, title: it.title, price: it.price, ship: ship, fee: fee, total: total, stage: 'ship', date: '오늘', eta: '11월 20일(목) 도착 예정', waybill: 'CJ대한통운 6412-' + (3000 + Math.floor(Math.random() * 6000)) + '-' + (1000 + Math.floor(Math.random() * 8999)) };
        S.orders.unshift(o);
        save();
        layer('<div class="backdrop" data-act="close"></div><div class="sheet"><div class="sheet-grip"></div>' +
          '<div class="sheet-body"><div class="done-block"><div class="done-ico">' + ico('check') + '</div>' +
          '<h3>결제가 완료됐어요</h3><p>결제금 ' + won(total) + '원을 대파가 안전하게 보관하고 있어요.<br>배송이 시작되면 알림으로 알려드릴게요.</p>' +
          '<div class="done-rows"><div class="rows"><div class="row"><span class="k">주문번호</span><span class="v">' + o.waybill.slice(-9) + '</span></div>' +
          '<div class="row"><span class="k">도착 예정</span><span class="v">11월 20일(목)</span></div>' +
          '<div class="row"><span class="k">보관 금액</span><span class="v">' + won(total) + '원</span></div></div></div></div></div>' +
          '<div class="sheet-foot" style="display:flex;gap:8px"><button class="btn-secondary" style="flex:1" data-act="close">닫기</button>' +
          '<button class="btn-primary" style="flex:1.3;height:50px" data-act="goto-me" data-id="orders">내 거래 보기</button></div></div>');
        break;
      }
      case 'dep': {
        const it = itemById(id);
        const dep = depositOf(it.price);
        const times = ['오늘 오후 7:00', '내일 오전 11:00', '내일 오후 2:00', '토요일 오후 1:00'];
        const r = { id: 'r' + Date.now(), itemId: it.id, title: it.title, price: it.price, deposit: dep, when: times[pickTime], place: '역삼역 2번 출구', stage: 'booked' };
        S.reserves.unshift(r);
        save();
        layer('<div class="backdrop" data-act="close"></div><div class="sheet"><div class="sheet-grip"></div>' +
          '<div class="sheet-body"><div class="done-block"><div class="done-ico">' + ico('clock') + '</div>' +
          '<h3>예약이 확정됐어요</h3><p>' + esc(r.when) + ' · ' + esc(r.place) + '<br>예약금 ' + won(dep) + '원은 거래가 끝나면 상품가에서 차감돼요.</p>' +
          '<div class="done-rows"><div class="rows"><div class="row"><span class="k">약속 시간</span><span class="v">' + esc(r.when) + '</span></div>' +
          '<div class="row"><span class="k">장소</span><span class="v">' + esc(r.place) + '</span></div>' +
          '<div class="row"><span class="k">현장 잔금</span><span class="v">' + won(r.price - dep) + '원</span></div></div></div></div></div>' +
          '<div class="sheet-foot" style="display:flex;gap:8px"><button class="btn-secondary" style="flex:1" data-act="close">닫기</button>' +
          '<button class="btn-primary" style="flex:1.3;height:50px" data-act="goto-me" data-id="reserves">내 거래 보기</button></div></div>');
        break;
      }
      case 'picktime': {
        pickTime = Number(el.getAttribute('data-i'));
        Array.prototype.forEach.call(document.querySelectorAll('[data-act="picktime"]'), function (b, i) {
          b.classList.toggle('on', Number(b.getAttribute('data-i')) === pickTime);
        });
        break;
      }
      case 'send': {
        const inp = $('#chatIn');
        if (!inp) break;
        const text = inp.value.trim();
        if (!text) { inp.focus(); break; }
        const msgs = chatSeed(id);
        msgs.push({ who: 'me', text: text });
        save();
        const box = $('#msgs');
        box.insertAdjacentHTML('beforeend', msgHTML({ who: 'me', text: text }));
        inp.value = '';
        box.scrollTop = box.scrollHeight;
        setTimeout(function () {
          const reply = '네, 확인했어요! 바로 답변드릴게요. 대파 안심결제로 진행하시면 안전해요 :)';
          msgs.push({ who: 'them', text: reply });
          save();
          if ($('#msgs')) {
            $('#msgs').insertAdjacentHTML('beforeend', msgHTML({ who: 'them', text: reply }));
            $('#msgs').scrollTop = $('#msgs').scrollHeight;
          }
        }, 700);
        break;
      }

      /* sell form */
      case 'mode': {
        form.mode = el.getAttribute('data-mode');
        render();
        break;
      }
      case 'fcat': { form.cat = el.getAttribute('data-cat'); render(); break; }
      case 'fcond': { form.cond = el.getAttribute('data-c'); render(); break; }
      case 'ftrade': { form.trade = el.getAttribute('data-t'); render(); break; }
      case 'toggle': {
        const k = el.getAttribute('data-k');
        form[k] = !form[k];
        el.classList.toggle('on', form[k]);
        break;
      }
      case 'qp': {
        form.price = String(el.getAttribute('data-p'));
        render();
        break;
      }
      case 'photo-pick': openPhotoPick(Number(el.getAttribute('data-i'))); break;
      case 'pickart': {
        const i = Number(el.getAttribute('data-i'));
        form.photos[i] = el.getAttribute('data-art');
        closeSheet();
        render();
        break;
      }
      case 'sample-photo': {
        form.photos = [ART_BY_CAT[form.cat] || 'box', null, null];
        render();
        toast('예시 사진을 넣었어요');
        break;
      }
      case 'upload': {
        const inp = $('#fileIn');
        if (inp) inp.click();
        break;
      }
      case 'rmphoto': {
        const i = Number(el.getAttribute('data-i'));
        form.photos[i] = null;
        render();
        break;
      }
      case 'submit': submitListing(); break;

      /* my page */
      case 'metab': S.metab = el.getAttribute('data-t'); save(); render(); break;
      case 'goto-me': {
        S.metab = el.getAttribute('data-id');
        save();
        closeSheet();
        go('me');
        break;
      }
      case 'confirm': {
        const o = S.orders.filter((x) => x.id === id)[0];
        if (o) { o.stage = 'done'; save(); render(); toast('구매확정! 판매자에게 정산됐어요'); }
        break;
      }
      case 'unreserve': {
        S.reserves = S.reserves.filter((r) => r.id !== id);
        save(); render(); toast('예약을 취소했어요. 예약금은 환불돼요');
        break;
      }
      case 'note': toast(el.getAttribute('data-msg') || '준비 중이에요'); break;
      case 'pickup': {
        const p = S.proxies.filter((x) => x.id === id)[0];
        if (!p) break;
        if (p.stage !== 'selling') {
          toast(p.stage === 'pickup' ? '이미 택배 수거를 요청했어요' : '판매가 확정된 뒤에 수거를 요청할 수 있어요');
          break;
        }
        p.stage = 'pickup';
        p.waybill = 'CJ대한통운 ' + (6000 + Math.floor(Math.random() * 3000)) + '-' + (1000 + Math.floor(Math.random() * 8999));
        p.pickupEta = '내일 오전 10시~오후 2시 방문 예정';
        save();
        render();
        toast('택배 수거를 요청했어요');
        break;
      }
      case 'reset': openConfirmReset(); break;
      case 'reset-do': {
        try { localStorage.removeItem(KEY); } catch (err) {}
        S = JSON.parse(JSON.stringify(DEFAULT_STATE));
        closeSheet();
        scrollMemo.home = 0;
        view = { name: 'home' };
        render();
        toast('데모 데이터를 초기화했어요');
        break;
      }
    }
  });

  function go2(it) {
    if (!it) return;
    view = { name: 'detail', id: it.id };
    photoIdx = 0;
    render();
  }

  document.addEventListener('input', function (e) {
    const id = e.target.id;
    if (id === 'q') {
      S.q = e.target.value;
      save();
      renderFeed();
      const clr = document.querySelector('.srch-clear');
      if (clr) clr.style.display = S.q ? '' : 'none';
    } else if (id === 'in-title') {
      form.title = e.target.value;
      const fld = e.target.closest('.field');
      if (fld) fld.classList.remove('invalid');
    } else if (id === 'in-price') {
      const d = digits(e.target.value).slice(0, 9);
      form.price = d;
      e.target.value = d ? won(d) : '';
      const fld = e.target.closest('.field');
      if (fld) fld.classList.remove('invalid');
      const f = feeOf();
      const a = $('#fee-price'), b = $('#fee-fee'), c = $('#fee-payout');
      if (a) a.textContent = won(f.price) + '원';
      if (b) b.textContent = '-' + won(f.fee) + '원';
      if (c) c.textContent = won(f.payout) + '원';
    } else if (id === 'in-desc') {
      form.desc = e.target.value;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'chatIn') {
      e.preventDefault();
      const btn = document.querySelector('[data-act="send"]');
      if (btn) btn.click();
    }
    if (e.key === 'Enter' && e.target.id === 'q') {
      e.preventDefault();
      e.target.blur();
    }
  });

  /* file upload (photos) */
  function wireFileInput() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.id = 'fileIn';
    inp.style.display = 'none';
    inp.addEventListener('change', function () {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        const slot = form.photos.indexOf(null);
        form.photos[slot === -1 ? 0 : slot] = String(reader.result);
        closeSheet();
        render();
        toast('사진을 추가했어요');
      };
      reader.readAsDataURL(file);
      inp.value = '';
    });
    document.body.appendChild(inp);
  }

  function submitListing() {
    const title = (form.title || '').trim();
    const price = Number(form.price || 0);
    form.err = '';
    if (title.length < 2) {
      const f = $('#f-title');
      if (f) f.classList.add('invalid');
      const inp = $('#in-title');
      if (inp) inp.focus();
      return;
    }
    if (!price || price < 1000) {
      const f = $('#f-price');
      if (f) f.classList.add('invalid');
      const inp = $('#in-price');
      if (inp) inp.focus();
      return;
    }
    const isProxy = form.mode === 'proxy';
    const photos = form.photos.filter(Boolean);
    const dataPhoto = photos.filter((p) => p.indexOf('data:') === 0)[0];
    const f2 = feeOf();
    const newId = 'c' + Date.now();
    const it = {
      id: newId,
      title: title,
      price: price,
      cat: form.cat,
      hood: S.hood,
      art: photos.filter((p) => p.indexOf('data:') !== 0)[0] || ART_BY_CAT[form.cat] || 'box',
      pal: PAL_BY_CAT[form.cat] || 'slate',
      trade: form.trade,
      fixed: !!form.fixed,
      deposit: form.trade !== 'ship',
      cond: form.cond,
      desc: form.desc || '설명은 판매자가 따로 등록하지 않았어요. 채팅으로 문의해 주세요.',
      seller: isProxy ? PROXY('나') : P('DUrake', 4.9, 3, 100),
      likes: 0,
      time: '방금 전',
      views: 0,
      mine: true,
      img: dataPhoto || null
    };
    S.custom.unshift(it);
    if (isProxy) {
      S.proxies.unshift({
        id: 'p' + Date.now(), itemId: newId, title: title, price: price,
        fee: f2.fee, payout: f2.payout, stage: 'received', date: '오늘', waybill: '', pickupEta: ''
      });
      S.metab = 'proxy';
      save();
      closeSheet();
      go('me');
      toast('정보 등록 완료 · 물건은 그대로 두시면 대파가 대신 팔아드려요');
    } else {
      S.metab = 'proxy';
      save();
      closeSheet();
      view = { name: 'detail', id: newId };
      photoIdx = 0;
      render();
      toast('매물을 등록했어요');
    }
  }

  /* ---------- boot ---------- */
  wireFileInput();
  render();

  window.addEventListener('resize', function () { /* layout is fluid */ });
})();

</script>
</body>
</html>
